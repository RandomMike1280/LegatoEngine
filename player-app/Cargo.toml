[package]
name = "legatoplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
deunicode = "1.6.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
flate2 = "1.1.10"
global-hotkey = "0.9.0"
hkdf = "0.13.0"
rfd = "0.17.2"
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
